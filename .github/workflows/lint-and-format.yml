name: Python Linting, Formatting, and Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-format-test:
    runs-on: ubuntu-latest
    env:
      # uv's managed Python bundles a current SQLite. The runner's system SQLite
      # (3.45) reports false NOT NULL violations from PRAGMA integrity_check for
      # rows that predate an ADD COLUMN ... NOT NULL DEFAULT.
      UV_PYTHON: "3.14"
      UV_PYTHON_PREFERENCE: only-managed
      PODLY_RUST_WRITER_BIN: ${{ github.workspace }}/rust/target/release/podly_writer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Writer parity and Rust/Python parity tests run against these binaries.
      - name: Build Rust binaries
        run: cargo build --release --locked --bins --manifest-path rust/Cargo.toml

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ty check
        run: uv run ty check

      - name: Run ruff check
        run: uv run ruff check src

      - name: Run ruff format
        run: uv run ruff format --check src

      - name: Run pytest
        run: uv run pytest --disable-warnings

      - name: Check writer registry parity
        run: uv run python scripts/check_writer_registry.py

      - name: Check writer schema snapshot
        run: uv run python scripts/check_writer_schema.py
