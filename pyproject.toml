[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podly-pure-podcasts"
version = "0.0.0"
description = "Ad-block for podcasts. Create an ad-free RSS feed."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai",
    "python-dotenv",
    "jinja2",
    "flask",
    "pyrss2gen",
    "feedparser",
    "werkzeug",
    "waitress",
    "validators",
    "beartype",
    "flask-sqlalchemy",
    "flask-migrate",
    "Flask-APScheduler",
    "ffmpeg-python",
    "litellm>=1.104.0",
    "groq",
    "flask-cors",
    "bcrypt",
    "stripe",
    "mutagen",
    "apprise>=1.13.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "types-requests",
    "types-waitress",
    "pytest",
    "pytest-cov",
    "dill",
    "types-flask-migrate",
    "pytest-mock",
    "watchdog",
    "requests",
    "types-flask-cors",
    "jsonschema",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
norecursedirs = ["scripts", "scripts/*", ".worktrees", ".worktrees/*"]
testpaths = []  # No test paths - tests converted to standalone scripts
# Fail CI if the warning families cleaned up in docs/plans/test_fixes.md
# regress. Scoped to those specific categories so unrelated third-party
# warnings don't break the suite.
filterwarnings = [
    "error::sqlalchemy.exc.LegacyAPIWarning",
    "error::pydantic.PydanticDeprecatedSince211",
    "error::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF", "PLC", "PLE", "PLR", "PLW", "ANN"]
ignore = [
    "E501",    # line-too-long (formatter handles it)
    # ANN — relaxed for gradual adoption
    "ANN001",  # missing-type-function-argument
    "ANN002",  # missing-type-args
    "ANN003",  # missing-type-kwargs
    "ANN201",  # missing-return-type-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN204",  # missing-return-type-special-method
    "ANN206",  # missing-return-type-class-method
    "ANN401",  # dynamically-typed-expressions (Any)
    # PLC
    "PLC0415", # import-outside-toplevel (intentional lazy imports)
    # PLR — rules that were globally disabled in the old pylint config
    "PLR0911", # too-many-return-statements
    "PLR0913", # too-many-arguments
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements
    "PLR0917", # too-many-positional-arguments
    "PLR2004", # magic-value-comparison
    # PLW
    "PLW0603", # global-statement (intentional module-level singletons)
    "PLW1508", # invalid-envvar-default (false positive on os.environ.get)
    # RUF
    "RUF001",  # ambiguous-unicode-character-string (false positives on en-dash)
    "RUF012",  # mutable-class-variable (config classes)
    # SIM — style preferences
    "SIM102",  # collapsible-if
    "SIM103",  # needless-bool
    "SIM105",  # use-contextlib-suppress
    "SIM108",  # if-else-block-instead-of-if-exp
    "SIM117",  # multiple-with-statements
    "SIM118",  # in-dict-keys
    "SIM201",  # negate-equal-op
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**/*.py" = ["ANN"]
"scripts/**/*.py" = ["ANN"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unresolved-attribute = "warn"
invalid-argument-type = "warn"
invalid-return-type = "warn"
invalid-method-override = "warn"
invalid-assignment = "warn"
no-matching-overload = "warn"
not-subscriptable = "warn"
# flask_sqlalchemy's `db.Model` is a dynamically-constructed declarative base
# that ty cannot resolve an MRO for, so every `class X(db.Model)` would
# otherwise emit a spurious unsupported-base diagnostic.
unsupported-base = "ignore"

# Tests routinely assign Mock/MagicMock onto instance methods, which ty flags
# as invalid-assignment. That pattern is intentional in test code.
[[tool.ty.overrides]]
include = ["src/tests/**"]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"
